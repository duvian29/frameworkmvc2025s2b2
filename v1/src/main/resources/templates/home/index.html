<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roller Speed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Roller Speed</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/index/home/mision}">Misión</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/index/home/vision}">Visión</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/index/home/valores}">Valores</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/index/home/servicios}">Servicios</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/index/home/eventos}">Eventos</a></li>
         <!--Registro -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            Registro
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/registro/estudiante}">Inscripción Estudiante</a></li>
            <li><a class="dropdown-item" th:href="@{/registro/instructor}">Inscripción Instructor</a></li>
          </ul>
        </li>

        <!-- Clases -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            Clases
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/clases/horario-estudiante}">Horario Estudiante</a></li>
            <li><a class="dropdown-item" th:href="@{/clases/horario-instructor}">Horario Instructor</a></li>
            <li><a class="dropdown-item" th:href="@{/clases/listar-estudiantes}">Listar Estudiantes</a></li>
          </ul>
        </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="container mt-5 text-center">
    <h1 th:text="${mensaje}">Roller Speed</h1>
    <p class="lead">Selecciona una opción del menú</p>
  </div>

  <!-- Pie de pagina -->
  <footer class="bg-dark text-light text-center py-3 mt-5">
    <p class="mb-0">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2025</span> Roller Speed</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
